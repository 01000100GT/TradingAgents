[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingagents"
version = "0.1.0"
description = "Multi-Agents LLM Financial Trading Framework"
authors = [
    {name = "TradingAgents Team", email = "yijia.xiao@cs.ucla.edu"}
]
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Trading Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Office/Business :: Financial :: Investment",
]
keywords = ["trading", "finance", "llm", "agents", "multi-agent"]

dependencies = [
    "typing-extensions",
    "langchain-openai",
    "langchain-experimental", 
    "pandas",
    "yfinance",
    "praw",
    "feedparser",
    "stockstats",
    "eodhd",
    "langgraph",
    "chromadb",
    "setuptools",
    "backtrader",
    "akshare",
    "tushare",
    "finnhub-python",
    "parsel",
    "requests",
    "tqdm",
    "pytz",
    "redis",
    "chainlit",
    "rich",
    "questionary",
    "typer",
    "pydantic",
    "tenacity",
]

[project.urls]
Homepage = "https://github.com/TauricResearch"
Repository = "https://github.com/TauricResearch"

[project.scripts]
tradingagents = "cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["tradingagents*", "cli*"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[tool.uv.sources]
# 如果需要指定特定的包源，可以在这里配置

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true 

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true